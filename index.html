<style>
  /* ===== 报纸风令牌（与博客同源设计语言）===== */
  :root{
    --paper:#f6f2e8; --paper-2:#fbf8f0;
    --ink:#17140f; --ink-2:#3a342b; --muted:#6d6557;
    --rule:#d9d1bf; --rule-strong:#b3a88f;
    --accent:#9c1f16; --seal:#a8322a; --accent-soft:#eee0d6; --accent-2:#2f4a3a;
    --serif:'Songti SC','STSong','SimSun','Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC',Georgia,serif;
    --sans:'PingFang SC','HarmonyOS Sans','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
    --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
    --measure:34em; --page:1100px;
    --gap:clamp(18px,2.6vw,30px); --radius:0px;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#14120e; --paper-2:#1a1712;
    --ink:#f2ecdd; --ink-2:#d3c9b6; --muted:#9c9180;
    --rule:#322c24; --rule-strong:#4b4338;
    --accent:#dd6a58; --seal:#d0604f; --accent-soft:#35211c; --accent-2:#93b39c;
  }}
  /* 手动主题切换时覆盖上面的取值 */
  html[data-theme=light]{--paper:#f6f2e8;--paper-2:#fbf8f0;--ink:#17140f;--ink-2:#3a342b;--muted:#6d6557;
    --rule:#d9d1bf;--rule-strong:#b3a88f;--accent:#9c1f16;--seal:#a8322a;--accent-soft:#eee0d6;--accent-2:#2f4a3a;}
  html[data-theme=dark]{--paper:#14120e;--paper-2:#1a1712;--ink:#f2ecdd;--ink-2:#d3c9b6;--muted:#9c9180;
    --rule:#322c24;--rule-strong:#4b4338;--accent:#dd6a58;--seal:#d0604f;--accent-soft:#35211c;--accent-2:#93b39c;}

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
    font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;font-feature-settings:'palt' 1}
  a{color:inherit;text-decoration:none;transition:color .16s ease}
  a:hover{color:var(--accent)}
  img{max-width:100%;display:block;filter:saturate(.92)}
  .page{max-width:var(--page);margin:0 auto;padding:0 var(--gap) 70px}

  /* ===== 报头 ===== */
  .masthead{border-bottom:3px double var(--ink);padding:26px 0 14px;margin-bottom:0}
  .masthead-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brandmark{display:flex;align-items:center;gap:12px}
  .brandmark .logo{width:46px;height:46px;flex:none}
  .brandmark .logo svg{width:100%;height:100%;display:block}
  /* 风车绕轴匀速转 */
  .brandmark .logo .wheel{transform-origin:50% 50%;animation:zjt-spin 9s linear infinite}
  @keyframes zjt-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.brandmark .logo .wheel{animation:none}}
  .brand-name{font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--ink)}
  .brand-sub{font-size:11.5px;letter-spacing:.22em;color:var(--muted);font-family:var(--sans)}
  .masthead-meta{font-family:var(--sans);font-size:12px;color:var(--muted);text-align:right;letter-spacing:.04em}
  .masthead-meta b{color:var(--ink);font-weight:600}

  /* 报名字号 */
  .nameplate{padding:30px 0 22px;text-align:center;border-bottom:1px solid var(--rule)}
  .nameplate h1{margin:0;font-size:clamp(34px,7vw,72px);line-height:1.02;letter-spacing:-.02em;font-weight:700}
  .nameplate .tagline{margin-top:14px;font-size:clamp(14px,1.7vw,17px);color:var(--ink-2);
    font-style:italic;letter-spacing:.02em}
  .nameplate .dateline{margin-top:12px;font-family:var(--sans);font-size:12px;letter-spacing:.2em;
    color:var(--muted);text-transform:uppercase}

  /* ===== 栏目条 ===== */
  .sections{display:flex;justify-content:center;gap:clamp(14px,3vw,34px);flex-wrap:wrap;
    padding:11px 0;border-bottom:1px solid var(--rule);font-family:var(--sans);
    font-size:12.5px;letter-spacing:.14em;color:var(--muted)}
  .sections a{white-space:nowrap;border-bottom:1px solid transparent;padding-bottom:1px}
  .sections a:hover{color:var(--accent);border-bottom-color:var(--accent)}

  /* ===== 头版头条区 ===== */
  .lead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap);
    padding:30px 0;border-bottom:1px solid var(--rule)}
  @media(max-width:760px){.lead{grid-template-columns:1fr}}
  .lead-main .kicker{font-family:var(--sans);font-size:11.5px;letter-spacing:.24em;color:var(--accent);
    text-transform:uppercase;margin-bottom:10px}
  .lead-main h2{margin:0 0 14px;font-size:clamp(24px,3.4vw,38px);line-height:1.22;letter-spacing:-.01em}
  .deck{font-size:16.5px;color:var(--ink-2);line-height:1.8;max-width:var(--measure)}
  .lead-side{border-left:1px solid var(--rule);padding-left:var(--gap)}
  @media(max-width:760px){.lead-side{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:20px}}
  .cover{border:1px solid var(--rule);background:var(--paper-2)}
  .cover figcaption{font-family:var(--sans);font-size:11.5px;color:var(--muted);padding:7px 10px;
    border-top:1px solid var(--rule);letter-spacing:.04em}

  /* ===== 数据版（报纸"数字栏"）===== */
  .figures{padding:26px 0;border-bottom:1px solid var(--rule)}
  .figures-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
  .figures-head h2{margin:0;font-size:13px;font-family:var(--sans);letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted)}
  .figures-head .note{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
  .fig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:0;
    border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
  .fig{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 14px;text-align:center}
  .fig .n{font-size:clamp(24px,3.6vw,36px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  .fig .n .u{font-size:.48em;font-weight:400;color:var(--muted);margin-left:2px}
  .fig .l{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--muted);margin-top:6px}
  .fig.hi .n{color:var(--accent)}

  /* ===== 作品详情 ===== */
  .piece{padding:30px 0;border-bottom:1px solid var(--rule)}
  .piece-head{margin-bottom:18px}
  .piece-head h2{margin:0 0 8px;font-size:clamp(20px,2.6vw,28px);line-height:1.3}
  .piece-meta{font-family:var(--sans);font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
  .piece-meta b{color:var(--ink-2);font-weight:600}
  .piece-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr);gap:var(--gap);align-items:start}
  @media(max-width:760px){.piece-body{grid-template-columns:1fr}}

  /* 互动构成：一条堆叠条 + 图例（替代原来 6 条无意义的横槽） */
  .compose{border-top:1px solid var(--rule);padding-top:14px}
  .compose .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .compose .cap b{font-family:var(--sans);font-size:11.5px;letter-spacing:.18em;color:var(--muted);font-weight:600}
  .compose .cap span{font-family:var(--sans);font-size:11px;color:var(--muted)}
  .stack{display:flex;height:14px;border:1px solid var(--ink);overflow:hidden}
  .stack i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
  .legend i{width:9px;height:9px;display:inline-block;flex:none}
  .legend b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}

  /* ===== 按钮（报纸风：方、实、无阴影）===== */
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-block;padding:10px 22px;background:var(--ink);color:var(--paper);
    font-family:var(--sans);font-size:13.5px;letter-spacing:.08em;border:1px solid var(--ink);
    transition:.16s}
  .btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
  .btn.ghost:hover{background:transparent;color:var(--accent);border-color:var(--accent)}

  /* ===== 预告（报纸"启事"框）===== */
  .notice-box{padding:30px 0}
  .notice-inner{border:2px solid var(--ink);padding:26px 24px;text-align:center;background:var(--paper-2)}
  .notice-inner .kicker{font-family:var(--sans);font-size:11.5px;letter-spacing:.26em;
    color:var(--accent);text-transform:uppercase}
  .notice-inner h2{margin:10px 0 12px;font-size:clamp(20px,2.6vw,27px)}
  .notice-inner p{color:var(--ink-2);max-width:600px;margin:0 auto;font-size:15.5px}
  .notice-inner .stamp{display:inline-block;margin-top:18px;font-family:var(--sans);font-size:12px;
    letter-spacing:.18em;color:var(--accent);border:1px solid var(--accent);padding:4px 14px}

  /* ===== 扫码区 ===== */
  .qrbox{padding:30px 0;border-bottom:1px solid var(--rule)}
  .qrbox .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  .qrbox .head h2{margin:0;font-size:13px;font-family:var(--sans);letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted)}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;
    border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
  .qr-item{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
    padding:22px 18px;display:flex;gap:18px;align-items:center}
  .qr-item .code{flex:none;width:96px;height:96px;border:1px solid var(--rule);background:#fff;padding:5px}
  .qr-item .code svg,.qr-item .code img{width:100%;height:100%;display:block}
  .qr-item .txt .t{font-size:15px;font-weight:700;margin-bottom:5px}
  .qr-item .txt .d{font-size:12.5px;color:var(--muted);line-height:1.7;font-family:var(--sans)}

  /* ===== 报尾 ===== */
  .colophon{border-top:3px double var(--ink);margin-top:34px;padding:18px 0;
    font-family:var(--sans);font-size:11.5px;color:var(--muted);letter-spacing:.06em;
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative}
  .colophon .eagle{position:absolute;right:0;bottom:4px;width:50px;height:50px;opacity:.13;pointer-events:none}
  .colophon .eagle svg{width:100%;height:100%;display:block}
</style>

<script>
const fmt=n=>{
  if(n>=100000000)return (n/100000000).toFixed(1);
  if(n>=10000)return (n/10000).toFixed(1);
  return String(n);
};
const unit=n=>n>=100000000?'亿':(n>=10000?'万':'');
const dur=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const date=ts=>new Date(ts*1000).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});

document.getElementById('today').textContent =
  new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});

fetch('data/creator.json?_='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('name').textContent=d.name;
  document.getElementById('sign').textContent='「'+d.sign+'」';

  const v=d.videos[0],s=v.stat;
  const totalPlay=d.videos.reduce((a,x)=>a+x.stat.view,0);

  // 头版头条
  document.getElementById('lead').innerHTML=`
    <div class="lead-main">
      <div class="kicker">头版头条 · 代表作</div>
      <h2><a href="${v.url}" target="_blank" rel="noopener">${v.title}</a></h2>
      <p class="deck">${v.desc||''}　该视频累计获得 <b>${fmt(s.view)}${unit(s.view)}</b> 次播放，
        <b>${fmt(s.like)}</b> 次点赞，互动率 <b>${v.interaction_rate}%</b>。</p>
      <div class="acts">
        <a class="btn" href="${v.url}" target="_blank" rel="noopener">在 B 站观看</a>
        <a class="btn ghost" href="https://space.bilibili.com/${d.mid}" target="_blank" rel="noopener">UP主主页</a>
        <a class="btn ghost" href="poster.html">存海报分享</a>
      </div>
    </div>
    <div class="lead-side">
      <figure class="cover" style="margin:0">
        <img src="assets/cover.webp" alt="${v.title}" width="560" height="350">
        <figcaption>${v.title}　${dur(v.duration)}</figcaption>
      </figure>
    </div>`;

  // 数据版
  const figs=[
    ['累计播放',fmt(totalPlay),unit(totalPlay)],
    ['点赞',fmt(s.like),unit(s.like)],
    ['评论',fmt(s.reply),unit(s.reply)],
    ['投币',fmt(s.coin),unit(s.coin)],
    ['收藏',fmt(s.favorite),unit(s.favorite)],
    ['转发',fmt(s.share),unit(s.share)],
    ['弹幕',fmt(s.danmaku),unit(s.danmaku)],
    ['互动率',v.interaction_rate,'%'],
  ];
  document.getElementById('figs').innerHTML=figs.map(([l,n,u],i)=>
    `<div class="fig${i===7?' hi':''}"><div class="n">${n}<span class="u">${u}</span></div><div class="l">${l}</div></div>`
  ).join('');

  // 作品详情（去掉重复封面，改为数据 + 简介两栏）
  document.getElementById('pieces').innerHTML=d.videos.map(x=>{
    const xs=x.stat;
    const ir=((xs.like+xs.coin+xs.favorite+xs.share)/xs.view*100).toFixed(2);
    // 互动构成：墨阶堆叠（报纸印刷感），亮度递减
    const parts=[
      ['点赞', xs.like,     '1'],
      ['投币', xs.coin,     '.78'],
      ['收藏', xs.favorite, '.6'],
      ['转发', xs.share,    '.44'],
      ['评论', xs.reply,    '.3'],
      ['弹幕', xs.danmaku,  '.18'],
    ];
    const total=parts.reduce((a,p)=>a+p[1],0)||1;
    const segs=parts.map(([k,v,o])=>({k,v,o,pct:Math.round(v/total*1000)/10}));
    return `<div class="piece">
      <div class="piece-head">
        <h2>${x.title}</h2>
        <div class="piece-meta">
          <span>时长 <b>${dur(x.duration)}</b></span>
          <span>发布 <b>${date(x.pubdate)}</b></span>
          <span>播放 <b>${fmt(xs.view)}${unit(xs.view)}</b></span>
          <span>互动率 <b>${ir}%</b></span>
        </div>
      </div>
      <div class="piece-body">
        <div>
          <p class="deck">${x.desc||'（暂无简介）'}</p>
          <p class="deck" style="margin-top:14px;font-size:15px;color:var(--muted)">
            该作品是频道内互动表现最好的内容之一，互动率 <b>${ir}%</b>；
            其中点赞与投币合计占互动的
            <b>${Math.round((xs.like+xs.coin)/total*100)}%</b>。
          </p>
          <div class="acts">
            <a class="btn" href="${x.url}" target="_blank" rel="noopener">在 B 站观看</a>
          </div>
        </div>
        <div>
          <div class="compose">
            <div class="cap"><b>互动构成</b><span>共 ${fmt(total)} 次</span></div>
            <div class="stack">
              ${segs.map(s=>`<i style="width:${s.pct}%;background:var(--accent);opacity:${s.o}"></i>`).join('')}
            </div>
            <div class="legend">
              ${segs.map(s=>`<span><i style="background:var(--accent);opacity:${s.o}"></i>${s.k} <b>${fmt(s.v)}</b></span>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}).catch(e=>{
  document.getElementById('lead').innerHTML='<div class="lead-main"><p class="deck">数据加载失败：'+e.message+'</p></div>';
});
</script>
</body></html>
